plugin:
  name: custom-data-type-dante
  version: 1.5
  url: https://github.com/programmfabrik/fylr-plugin-custom-data-type-dante
  displayname:
    de-DE: DANTE-Verknüpfung
    en-US: DANTE-Referencing
  info:
    de-DE: |
      Stellt einen eigenen Feldtyp bereit, mit dem Datensätze mit Konzepten aus Vokabularen des [DANTE-Terminologieservers](https://dante.gbv.de) verknüpft werden. Legen Sie pro Feld ein oder mehrere Vokabulare fest, sodass Redakteure den passenden Begriff suchen und auswählen, statt ihn frei einzugeben.

      - Auswahl, aus welchem DANTE-Vokabular bzw. welchen Vokabularen ein Feld schöpft; im Popup-Modus kombinierbar
      - Editor-Darstellung: Dropdown, Popup oder Popup mit Baumansicht
      - Optionales Anlegen neuer Einträge in einem Zielvokabular
      - Hierarchische Beschriftungen und zwischengespeicherte Abfragen
    en-US: |
      Adds a custom data type for linking records to concepts from vocabularies hosted on the [DANTE terminology server](https://dante.gbv.de). Choose one or more vocabularies per field so editors can search and select the right term instead of typing it as free text.

      - Pick which DANTE vocabulary or vocabularies a field draws from; several can be combined in popup mode
      - Editor styles: dropdown, popup, or popup with tree view
      - Optionally let editors add new records to a target vocabulary
      - Hierarchical labels and cached lookups
  l10n: l10n/customDataTypeDante.csv
  webfrontend:
    url: customDataTypeDante.js
    css: customDataTypeDante.css
    dependencies:
      - commons-library

base_url_prefix: "webfrontend"

custom_types:
  dante:
    mapping:
      conceptName:
        type: text
      conceptURI:
        type: text
        skipTerms: true
      conceptAncestors:
        type: text
        skipTerms: true
      conceptSource:
        type: text
        skipTerms: true
      conceptGeoJSON:
        type: geo_json
        skipTerms: true
      facetTerm:
        type: text_l10n
        skipTerms: true
    update:
      plugin_user:
        reference: system:root
      exec:
        service: "node"
        commands:
          - prog: "node"
            stdin:
              type: body
            stdout:
              type: body
            args:
              - type: "value"
                value: "%_exec.pluginDir%/updater/DANTEUpdater.js"
              - type: "value"
                value: "%info.json%"
      timeout: 300
      batch_size: 10
      expires_days: 1
      interval_base_config: update_interval_dante.days
    config:
      schema:
        - name: vocabulary_name
          parameters:
            value:
              type: text
        - name: insert_allowed
          parameters:
            value:
              type: bool
        - name: insert_voc_notation
          parameters:
            value:
              type: text
        - name: insert_username
          parameters:
            value:
              type: text
        - name: insert_token
          parameters:
            value:
              type: text
      mask:
        - name: editor_style
          parameters:
            value:
              type: select
              options: ["popover", "popover_with_treeview", "dropdown"]
        - name: editor_display
          parameters:
            value:
              type: select
              options: ["default", "condensed"]
        - name: use_dropdown_info_popup
          parameters:
            value:
              type: bool
        - name: use_cache
          parameters:
            value:
              type: bool
        - name: allow_label_choice
          parameters:
            value:
              type: bool
        - name: label_with_hierarchie
          parameters:
            value:
              type: bool
        - name: ancestors
          parameters:
            value:
              type: text
        - name: default_concept_uri
          parameters:
            value:
              type: text
        - name: default_concept_name
          parameters:
            value:
              type: text
        - name: vocabulary_name_overwrite
          parameters:
            value:
              type: text

base_config:
  - name: debug_dante
    group: debug_custom_data_type
    parameters:
      enable_debug:
        type: bool
        default: false
        position: 0
  - name: update_dante
    group: update_custom_data_type
    parameters:
      restrict_time:
        type: bool
        default: false
        position: 0
      from_time:
        type: int
        default: 19
        min: 0
        max: 23
        position: 1
      to_time:
        type: int
        default: 4
        min: 0
        max: 23
        position: 2
      default_language:
        type: text
        default: 'de'
        position: 3
      custom_expires_days:
        type: int
        min: 1
        default: 1
        position: 4
  - name: mapbox_dante
    group: mapbox_update_custom_data_type
    parameters:
      mapbox_access_token:
        type: text
        position: 0

system_rights:
  - name: dante_plugin
    parameters:
      - name: dante_allow_add_records
        type: bool
